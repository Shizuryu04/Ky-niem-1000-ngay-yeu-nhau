<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="1000 ngày đôi ta bên nhau.">

    <title>Mở Khóa Kỷ Niệm 1000 Ngày</title> <!-- Xóa Emoji -->

    <!-- Google Fonts: Baloo 2 & Quicksand (Đã cập nhật) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <main class="login-container"> <!-- Container chính -->

        <!-- Ảnh Trang Trí cho Login (Đã thêm) -->
        <div class="deco-item deco-login-1"></div> <!-- Ảnh Chiikawa cầm chìa khóa -->
        <div class="deco-item deco-login-2"></div> <!-- Ảnh Ngôi sao -->

        <!-- Header thông tin -->
        <header class="login-header">
            <h1 class="login-title">1000 Ngày Mình Yêu Nhau</h1>
            <div class="anniversary-info">
                <p class="start-date">Ngày Bắt Đầu: <span id="start-date-value"> 05/08/2022 </span></p>
                <p class="days-count">Đã cùng nhau <span id="days-counter">999</span> ngày ngọt ngào!</p> <!-- Bạn có thể cần cập nhật số ngày này bằng JS hoặc thủ công -->
            </div>
        </header>

        <!-- Form đăng nhập -->
        <form id="login-form" class="login-form">
            <p class="form-instruction">Mật mã bí mật :>></p>
            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu:</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Nhập ở đây nè..." required> <!-- Xóa Emoji -->
            </div>

            <button type="submit" id="submit-button" class="submit-button">
                Mở Khóa Kỷ Niệm
            </button> <!-- Xóa Emoji -->

            <p id="error-message" class="error-message" style="display: none;">
                Oops! Mật mã chưa đúng rồi, thử lại nhé em yêu!
            </p> <!-- Xóa Emoji -->
        </form>

    </main>

    <script src="js/script.js" defer></script>
</body>
</html>
